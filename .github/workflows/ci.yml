name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static checks (syntax, no random data, demo isolation, secrets)
        run: npm run check
      - name: Type check (JSDoc contracts, server + shared)
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests (calculations, calendar, accounting, grounding)
        run: npm run test:unit
      - name: Integration tests (real Postgres via PGlite, MOCKED provider)
        run: npm run test:integration
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: E2E journeys (demo data, desktop + phone)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
