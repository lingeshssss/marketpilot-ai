# External scheduler for background jobs. Vercel Hobby crons run at most once
# per day; this triggers alert evaluation more often. Requires repository
# secrets APP_URL (e.g. https://marketpilot-ai-gilt.vercel.app) and CRON_SECRET.
name: Scheduled jobs
on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'   # every 15 min across US market hours (UTC)
    - cron: '15 22,23 * * 1-5'     # after the close, when end-of-day data publishes
    - cron: '0 3 * * 2-6'          # overnight catch-up
  workflow_dispatch:
    inputs:
      job:
        description: 'all | market | scanner | alerts | deliveries'
        default: all

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET secrets not set — skipping"; exit 0; fi
          JOB="${{ github.event.inputs.job || 'all' }}"
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$JOB")
          cat out.json; echo
          test "$code" = "200"
          node -e 'const r=require("./out.json").results;if(r.some(x=>x.status==="failed")){console.error("job failed");process.exit(1)}'
