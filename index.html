<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MarketPilot AI — Intelligent Stock Analysis & Sell Timing Intelligence</title>
  <meta name="description" content="AI-powered stock insight, risk signals, and sell timing intelligence. Analyze market conditions with probabilistic insights — not predictions." />
  <meta name="color-scheme" content="light dark" />
  <script>
    try {
      const preference = localStorage.getItem('marketpilot-appearance') || 'system';
      document.documentElement.dataset.theme = preference === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
    } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

</head>
